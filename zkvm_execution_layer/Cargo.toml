proofman-verifier = { git = "https://github.com/0xPolygonHermez/pil2-proofman.git", tag = "v0.12.0" }
zkm-verifier = { git = "https://github.com/ProjectZKM/Ziren", tag = "v1.2.1" }
bincode = { workspace = true }
tempfile = { workspace = true }
