[package]
name = "pq_attester_service"
version = "0.1.0"
edition = { workspace = true }

[features]
default = []
pq-devnet = [
    "dep:beacon_chain",
    "dep:consensus_signature",
    "dep:futures",
    "dep:lighthouse_validator_store",
    "beacon_chain/pq-devnet",
    "consensus_signature/pq-wire",
    "lighthouse_validator_store/pq-devnet",
    "dep:slot_clock",
    "dep:store",
    "store/leveldb",
    "dep:task_executor",
    "dep:tokio",
    "dep:types",
    "types/pq-devnet",
    "dep:validator_store",
]
pq-proposer = ["pq-devnet", "dep:network", "network/pq-proposer"]
pq-startup-testing = [
    "pq-devnet",
    "beacon_chain/pq-startup-testing",
    "dep:ethereum_ssz",
    "dep:state_processing",
    "network?/pq-startup-testing",
    "state_processing/pq-attestation",
]

[dependencies]
beacon_chain = { path = "../../beacon_node/beacon_chain", default-features = false, optional = true }
consensus_signature = { workspace = true, optional = true }
ethereum_ssz = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
lighthouse_validator_store = { path = "../lighthouse_validator_store", default-features = false, optional = true }
network = { path = "../../beacon_node/network", default-features = false, optional = true }
slot_clock = { workspace = true, optional = true }
state_processing = { workspace = true, optional = true }
store = { path = "../../beacon_node/store", default-features = false, optional = true }
task_executor = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
types = { workspace = true, optional = true }
validator_store = { path = "../validator_store", default-features = false, optional = true }

[dev-dependencies]
async-channel = { workspace = true }

[[test]]
name = "pq_local_attester"
path = "tests/pq_local_attester.rs"
required-features = ["pq-startup-testing"]
