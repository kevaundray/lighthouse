[package]
name = "lighthouse-validator-store-pq-tests"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.88"

[workspace]

[dependencies]
context_deserialize = "0.2"
eth2 = { path = "../../../../common/eth2", default-features = false, features = ["pq-devnet"] }
futures = "0.3"
initialized_validators = { path = "../../../initialized_validators", default-features = false, features = ["pq-devnet"] }
lighthouse_validator_store = { path = "../..", default-features = false, features = ["pq-devnet"] }
pq_devnet = { path = "../../../../testing/pq_devnet", default-features = false, features = ["pq-devnet"] }
pq_proposer_service = { path = "../../../pq_proposer_service", default-features = false, features = ["pq-devnet", "pq-startup-testing"] }
pq_signing = { path = "../../../../crypto/pq_signing", default-features = false, features = ["pq-devnet"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = "0.38"
sensitive_url = { version = "0.1", features = ["serde"] }
serde_json = "1"
signing_method = { path = "../../../signing_method", default-features = false, features = ["pq-devnet"] }
slashing_protection = { path = "../../../slashing_protection", default-features = false, features = ["pq-devnet"] }
slot_clock = { path = "../../../../common/slot_clock" }
task_executor = { path = "../../../../common/task_executor" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
types = { path = "../../../../consensus/types", default-features = false, features = ["pq-devnet"] }
validator_metrics = { path = "../../../validator_metrics" }
validator_store = { path = "../../../validator_store", default-features = false, features = ["pq-devnet"] }
warp = { version = "0.3.7", default-features = false }
