[package]
name = "libp2p-gossipsub"
edition = "2024"
rust-version = "1.88.0"
description = "Gossipsub protocol for libp2p"
version = "0.50.0"
authors = ["Age Manning <Age@AgeManning.com>"]
license = "MIT"
repository = "https://github.com/libp2p/rust-libp2p"
keywords = ["peer-to-peer", "libp2p", "networking"]
categories = ["network-programming", "asynchronous"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[features]
metrics = ["prometheus-client"]
partial-messages = []

[dependencies]
async-channel = "2.5.0"
asynchronous-codec = "0.7.0"
base64 = "0.22.1"
byteorder = "1.5.0"
bytes = "1.11.1"
either = "1.16"
fnv = "1.0.7"
futures = "0.3.30"
futures-timer = "3.0"
hashlink = "0.11.0"
hex_fmt = "0.3.0"
libp2p-core = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
libp2p-identity = { version = "0.2.14", features = ["rand"] }
libp2p-swarm = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }

# Metrics dependencies
prometheus-client = { version = "0.24", optional = true }
prost = "0.14"
prost-codec = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
rand = "0.8.0"
regex = "1.12.3"
serde = { version = "1", optional = true, features = ["derive"] }
sha2 = "0.10.8"
tracing = "0.1.44"
web-time = "1.1.0"

[target.'cfg(target_family="wasm")'.dependencies]
futures-timer = { version = "3.0", features = ["wasm-bindgen"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
libp2p-core = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
libp2p-swarm-test = { git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
quickcheck = { package = "quickcheck-ext", git = "https://github.com/sigp/rust-libp2p.git", rev = "c774d4e71357d7cd2f792c4767d616d2dd369ee3" }
tokio = { version = "1.52", default-features = false, features = ["rt", "rt-multi-thread", "time", "macros"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
used_underscore_binding = "warn"
unnecessary_wraps = "warn"
manual_let_else = "warn"
dbg_macro = "warn"
