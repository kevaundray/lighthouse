[package]
name = "network"
version = "0.2.0"
authors = ["Sigma Prime <contact@sigmaprime.io>"]
edition = { workspace = true }

[features]
default = ["beacon_chain/default"]
# NOTE: This can be run via cargo build --bin lighthouse --features network/disable-backfill
disable-backfill = []
fork_from_env = ["beacon_chain/fork_from_env"]
fake_crypto = ["bls/fake_crypto", "kzg/fake_crypto"]
portable = ["beacon_chain/portable"]
pq-devnet = [
    "beacon_chain/pq-devnet",
    "beacon_processor/pq-devnet",
    "consensus_signature/pq-devnet",
    "disable-backfill",
    "execution_layer/pq-devnet",
    "lighthouse_network/pq-devnet",
    "operation_pool/pq-devnet",
    "types/pq-devnet",
]
pq-startup-testing = [
    "pq-devnet",
    "beacon_chain/pq-startup-testing",
    "lighthouse_network/pq-startup-testing",
]

[dependencies]
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
beacon_chain = { path = "../beacon_chain", default-features = false }
beacon_processor = { workspace = true }
consensus_signature = { workspace = true }
delay_map = { workspace = true }
educe = { workspace = true }
ethereum_ssz = { workspace = true }
execution_layer = { workspace = true }
fixed_bytes = { workspace = true }
fnv = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
igd-next = { version = "0.16", features = ["aio_tokio"] }
itertools = { workspace = true }
lighthouse_network = { workspace = true }
logging = { workspace = true }
lru_cache = { workspace = true }
metrics = { workspace = true }
operation_pool = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
slot_clock = { workspace = true }
smallvec = { workspace = true }
ssz_types = { workspace = true }
store = { workspace = true }
strum = { workspace = true }
task_executor = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
typenum = { workspace = true }
types = { workspace = true }

[dev-dependencies]
arbitrary = { workspace = true }
beacon_chain = { workspace = true, features = ["arbitrary"] }
bls = { workspace = true }
eth2 = { workspace = true }
eth2_network_config = { workspace = true }
genesis = { workspace = true }
k256 = "0.13.4"
kzg = { workspace = true }
libp2p = { workspace = true }
matches = "0.1.8"
paste = { workspace = true }
rand_08 = { package = "rand", version = "0.8.5" }
rand_chacha = "0.9.0"
rand_chacha_03 = { package = "rand_chacha", version = "0.3.1" }
serde_json = { workspace = true }
types = { workspace = true, features = ["arbitrary"] }
