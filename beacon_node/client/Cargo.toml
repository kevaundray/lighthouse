[package]
name = "client"
version = "0.2.0"
authors = ["Sigma Prime <contact@sigmaprime.io>"]
edition = { workspace = true }

[features]
default = ["full-runtime", "slasher"]
full-runtime = ["dep:http_api", "dep:http_metrics", "dep:timer"]
slasher = ["beacon_chain/slasher", "dep:slasher", "dep:slasher_service"]
pq-devnet = [
    "beacon_chain/pq-devnet",
    "beacon_processor/pq-devnet",
    "consensus_signature/pq-devnet",
    "eth2/pq-devnet",
    "execution_layer/pq-devnet",
    "genesis/pq-devnet",
    "lighthouse_network/pq-devnet",
    "network/pq-devnet",
    "dep:pq_http_api",
    "dep:tokio-util",
    "dep:warp",
    "pq_http_api/pq-devnet",
    "store/pq-devnet",
    "types/pq-devnet",
]
pq-proposer = [
    "pq-devnet",
    "dep:initialized_validators",
    "dep:lighthouse_validator_store",
    "dep:pq_proposer_service",
    "dep:reqwest",
    "dep:slashing_protection",
    "initialized_validators/pq-devnet",
    "lighthouse_validator_store/pq-devnet",
    "network/pq-proposer",
    "pq_proposer_service/pq-devnet",
    "slashing_protection/pq-devnet",
]
pq-startup-testing = [
    "pq-devnet",
    "beacon_chain/pq-startup-testing",
    "network/pq-startup-testing",
    "pq_http_api/pq-startup-testing",
]

[dependencies]
beacon_chain = { path = "../beacon_chain", default-features = false }
beacon_processor = { workspace = true }
consensus_signature = { workspace = true }
directory = { workspace = true }
dirs = { workspace = true }
environment = { workspace = true }
eth2 = { workspace = true }
eth2_config = { workspace = true }
ethereum_ssz = { workspace = true }
execution_layer = { workspace = true }
futures = { workspace = true }
genesis = { workspace = true }
http_api = { workspace = true, optional = true }
http_metrics = { path = "../http_metrics", optional = true }
hyper = { workspace = true }
initialized_validators = { path = "../../validator_client/initialized_validators", optional = true, default-features = false }
kzg = { workspace = true }
lighthouse_network = { workspace = true }
lighthouse_validator_store = { path = "../../validator_client/lighthouse_validator_store", optional = true, default-features = false }
logging = { workspace = true }
metrics = { workspace = true }
monitoring_api = { workspace = true }
network = { path = "../network", default-features = false }
pq_http_api = { workspace = true, optional = true }
pq_proposer_service = { workspace = true, optional = true }
rand = { workspace = true }
reqwest = { workspace = true, optional = true }
rustix = { workspace = true }
sensitive_url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slasher = { workspace = true, optional = true }
slasher_service = { path = "../../slasher/service", optional = true }
slashing_protection = { path = "../../validator_client/slashing_protection", optional = true, default-features = false }
slot_clock = { workspace = true }
state_processing = { workspace = true }
store = { workspace = true }
task_executor = { workspace = true }
time = "0.3.5"
timer = { path = "../timer", optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
types = { workspace = true }
warp = { workspace = true, optional = true }
yaml_serde = { workspace = true }

[dev-dependencies]
async-channel = { workspace = true }
hex = { workspace = true }
operation_pool = { workspace = true }
pq_devnet = { path = "../../testing/pq_devnet", default-features = false, features = ["pq-devnet"] }
pq_signing = { workspace = true, features = ["pq-devnet"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
validator_dir = { workspace = true, features = ["pq-devnet"] }

[[test]]
name = "pq_runtime"
path = "tests/pq_runtime.rs"
required-features = ["pq-devnet", "pq-startup-testing"]
