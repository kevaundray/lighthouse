
[package]
name = "beacon_chain"
version = "0.2.0"
authors = ["Paul Hauner <paul@paulhauner.com>", "Age Manning <Age@AgeManning.com>"]
edition = { workspace = true }
autotests = false # using a single test binary compiles faster

[features]
default = [
    "operation_pool/leveldb",
    "participation_metrics",
    "slasher",
    "store/leveldb",
]
# Writes debugging .ssz files to /tmp during block processing.
write_ssz_files = []
# Exposes validator participation metrics to Prometheus.
participation_metrics = []
slasher = ["dep:slasher"]
# Initialise the harness chain spec from the FORK_NAME env variable
fork_from_env = []
portable = ["bls/supranational-portable"]
test_backfill = []
arbitrary = ["dep:arbitrary", "types/arbitrary"]
pq-wire = ["consensus_signature/pq-wire", "eth2/pq-wire", "types/pq-devnet"]
pq-devnet = [
    "dep:libc",
    "pq-wire",
    "consensus_signature/pq-devnet",
    "execution_layer/pq-devnet",
    "fork_choice/pq-devnet",
    "genesis/pq-devnet",
    "operation_pool/pq-devnet",
    "state_processing/pq-genesis",
    "state_processing/pq-transition",
    "store/pq-devnet",
]
# Exposes raw snapshot persistence only to the isolated PQ startup/restart harness.
pq-startup-testing = ["pq-devnet", "store/pq-startup-testing"]

[dependencies]
alloy-primitives = { workspace = true }
arbitrary = { workspace = true, optional = true }
bitvec = { workspace = true }
bls = { workspace = true }
consensus_signature = { workspace = true }
educe = { workspace = true }
eth2 = { workspace = true, features = ["lighthouse", "network"] }
eth2_network_config = { workspace = true }
ethereum_hashing = { workspace = true }
ethereum_serde_utils = { workspace = true }
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
execution_layer = { workspace = true }
fixed_bytes = { workspace = true }
fork_choice = { workspace = true }
futures = { workspace = true }
genesis = { workspace = true }
hashlink = { workspace = true }
hex = { workspace = true }
int_to_bytes = { workspace = true }
itertools = { workspace = true }
kzg = { workspace = true }
libc = { version = "0.2", optional = true }
lighthouse_version = { workspace = true }
logging = { workspace = true }
merkle_proof = { workspace = true }
metrics = { workspace = true }
milhouse = { workspace = true }
once_cell = { workspace = true }
oneshot_broadcast = { path = "../../common/oneshot_broadcast/" }
operation_pool = { path = "../operation_pool", default-features = false }
parking_lot = { workspace = true }
proto_array = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
safe_arith = { workspace = true }
sensitive_url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slasher = { workspace = true, optional = true }
slot_clock = { workspace = true }
smallvec = { workspace = true }
ssz_types = { workspace = true }
state_processing = { workspace = true }
store = { path = "../store", default-features = false }
strum = { workspace = true }
superstruct = { workspace = true }
task_executor = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tree_hash = { workspace = true }
tree_hash_derive = { workspace = true }
typenum = { workspace = true }
types = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
arbitrary = { workspace = true }
beacon_chain = { path = ".", default-features = false, features = ["arbitrary"] }
criterion = { workspace = true }
maplit = { workspace = true }
mockall = { workspace = true }
mockall_double = { workspace = true }
rand_xorshift = { workspace = true }
serde_json = { workspace = true }
types = { workspace = true, features = ["arbitrary"] }

[[bench]]
name = "benches"
harness = false

[[test]]
name = "beacon_chain_tests"
path = "tests/main.rs"
