[package]
name = "operation_pool"
version = "0.2.0"
authors = ["Michael Sproul <michael@sigmaprime.io>"]
edition = { workspace = true }

[features]
default = ["leveldb"]
leveldb = ["store/leveldb"]
portable = ["beacon_chain/portable"]
pq-devnet = [
    "attestation_aggregation/pq-attestation",
    "dep:attestation_aggregation",
    "dep:consensus_signature",
    "state_processing/pq-transition",
    "types/pq-devnet",
]
pq-startup-testing = ["attestation_aggregation/pq-startup-testing", "pq-devnet"]

[dependencies]
attestation_aggregation = { workspace = true, optional = true, default-features = false }
bitvec = { workspace = true }
bls = { workspace = true }
consensus_signature = { workspace = true, optional = true }
educe = { workspace = true }
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
fixed_bytes = { workspace = true }
itertools = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
state_processing = { workspace = true }
store = { path = "../store", default-features = false }
superstruct = { workspace = true }
typenum = { workspace = true }
types = { workspace = true }

[dev-dependencies]
beacon_chain = { workspace = true }
maplit = { workspace = true }
tokio = { workspace = true }
