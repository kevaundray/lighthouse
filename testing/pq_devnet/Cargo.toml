[package]
name = "pq_devnet"
version = "0.1.0"
edition = { workspace = true }
autotests = false

[[bin]]
name = "lcli-pq-devnet"
path = "src/main.rs"
required-features = ["pq-devnet"]

[features]
default = []
pq-devnet = [
    "dep:attestation_aggregation",
    "dep:clap",
    "dep:consensus_signature",
    "dep:ethereum_ssz",
    "dep:futures",
    "dep:hex",
    "dep:pq_signing",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:ssz_types",
    "dep:state_processing",
    "dep:types",
    "dep:validator_dir",
    "dep:zeroize",
    "consensus_signature/pq-devnet",
]
pq-randao-transport-testing = [
    "dep:consensus_signature",
    "dep:eth2",
    "dep:serde_json",
    "dep:types",
    "consensus_signature/pq-wire",
    "eth2/pq-wire",
    "types/pq-devnet",
]
pq-verification-testing = ["pq-devnet", "state_processing/pq-verification-testing"]
pq-transition-testing = ["pq-verification-testing", "state_processing/pq-transition"]

[dependencies]
attestation_aggregation = { workspace = true, optional = true, features = ["pq-attestation"] }
clap = { workspace = true, features = ["derive"], optional = true }
consensus_signature = { workspace = true, optional = true }
eth2 = { workspace = true, optional = true }
ethereum_ssz = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
pq_signing = { workspace = true, optional = true, features = ["pq-devnet"] }
rustix = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ssz_types = { workspace = true, optional = true }
state_processing = { workspace = true, optional = true, features = ["pq-genesis", "pq-verification"] }
types = { workspace = true, optional = true, features = ["pq-devnet"] }
validator_dir = { workspace = true, optional = true, features = ["pq-devnet"] }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "direct_genesis"
path = "tests/direct_genesis.rs"
required-features = ["pq-devnet"]

[[test]]
name = "provision"
path = "tests/provision.rs"
required-features = ["pq-devnet"]

[[test]]
name = "pq_attestation"
path = "tests/pq_attestation.rs"
required-features = ["pq-devnet"]

[[test]]
name = "pq_attestation_aggregation"
path = "tests/pq_attestation_aggregation.rs"
required-features = ["pq-devnet"]

[[test]]
name = "pq_consensus_verification"
path = "tests/pq_consensus_verification.rs"
required-features = ["pq-verification-testing"]

[[test]]
name = "pq_transition"
path = "tests/pq_transition.rs"
required-features = ["pq-transition-testing"]

[[test]]
name = "pq_local_transition"
path = "tests/pq_local_transition.rs"
required-features = ["pq-transition-testing"]

[[test]]
name = "pq_randao_transport"
path = "tests/pq_randao_transport.rs"
required-features = ["pq-randao-transport-testing"]
