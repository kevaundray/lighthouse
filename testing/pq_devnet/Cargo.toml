[package]
name = "pq_devnet"
version = "0.1.0"
edition = { workspace = true }
autotests = false

[[bin]]
name = "lcli-pq-devnet"
path = "src/main.rs"
required-features = ["pq-devnet"]

[features]
default = []
pq-devnet = [
    "dep:attestation_aggregation",
    "dep:clap",
    "dep:consensus_signature",
    "dep:ethereum_ssz",
    "dep:futures",
    "dep:hex",
    "dep:pq_signing",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:ssz_types",
    "dep:state_processing",
    "dep:types",
    "dep:validator_dir",
    "dep:zeroize",
    "consensus_signature/pq-devnet",
]
pq-beacon-startup-testing = [
    "pq-devnet",
    "dep:beacon_node",
    "dep:beacon_chain",
    "dep:environment",
    "dep:slot_clock",
    "dep:store",
    "dep:task_executor",
    "beacon_chain/pq-startup-testing",
    "store/pq-devnet",
]
pq-proposer = ["pq-beacon-startup-testing", "beacon_node/pq-proposer"]
pq-beacon-import-testing = [
    "pq-beacon-startup-testing",
    "pq-transition-testing",
    "dep:execution_layer",
    "dep:eth2",
    "dep:fork_choice",
    "dep:initialized_validators",
    "dep:lighthouse_validator_store",
    "dep:lighthouse_network",
    "dep:network",
    "dep:network_utils",
    "dep:pq_http_api",
    "dep:pq_proposer_service",
    "dep:reqwest",
    "dep:slashing_protection",
    "dep:warp",
    "beacon_chain/pq-proposer",
    "network/pq-startup-testing",
    "lighthouse_network/pq-proposer",
    "dep:operation_pool",
    "eth2/pq-wire",
]
pq-attestation-pool-testing = [
    "pq-beacon-startup-testing",
    "beacon_chain/pq-proposer",
    "dep:attestation_aggregation",
    "dep:execution_layer",
    "dep:operation_pool",
    "operation_pool/pq-startup-testing",
]
pq-randao-transport-testing = [
    "dep:consensus_signature",
    "dep:eth2",
    "dep:serde_json",
    "dep:types",
    "consensus_signature/pq-wire",
    "eth2/pq-wire",
    "types/pq-devnet",
]
pq-verification-testing = ["pq-devnet", "state_processing/pq-verification-testing"]
pq-transition-testing = ["pq-verification-testing", "state_processing/pq-transition"]

[dependencies]
attestation_aggregation = { workspace = true, optional = true, features = ["pq-attestation"] }
beacon_chain = { path = "../../beacon_node/beacon_chain", optional = true, default-features = false }
beacon_node = { path = "../../beacon_node", optional = true, default-features = false, features = ["pq-devnet"] }
clap = { workspace = true, features = ["derive"], optional = true }
consensus_signature = { workspace = true, optional = true }
environment = { workspace = true, optional = true }
eth2 = { workspace = true, optional = true }
ethereum_ssz = { workspace = true, optional = true }
execution_layer = { workspace = true, optional = true, features = ["pq-devnet"] }
fork_choice = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
initialized_validators = { path = "../../validator_client/initialized_validators", optional = true, default-features = false, features = ["pq-devnet"] }
lighthouse_network = { path = "../../beacon_node/lighthouse_network", optional = true, default-features = false }
lighthouse_validator_store = { path = "../../validator_client/lighthouse_validator_store", optional = true, default-features = false, features = ["pq-devnet"] }
network = { path = "../../beacon_node/network", optional = true, default-features = false, features = ["pq-devnet"] }
network_utils = { workspace = true, optional = true }
operation_pool = { workspace = true, optional = true, default-features = false }
pq_http_api = { path = "../../beacon_node/pq_http_api", optional = true, default-features = false, features = ["pq-startup-testing"] }
pq_proposer_service = { path = "../../validator_client/pq_proposer_service", optional = true, default-features = false, features = ["pq-devnet"] }
pq_signing = { workspace = true, optional = true, features = ["pq-devnet"] }
reqwest = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
slashing_protection = { path = "../../validator_client/slashing_protection", optional = true, default-features = false, features = ["pq-devnet"] }
slot_clock = { workspace = true, optional = true }
ssz_types = { workspace = true, optional = true }
state_processing = { workspace = true, optional = true, features = ["pq-genesis", "pq-verification"] }
store = { workspace = true, optional = true }
task_executor = { workspace = true, optional = true }
types = { workspace = true, optional = true, features = ["pq-devnet"] }
validator_dir = { workspace = true, optional = true, features = ["pq-devnet"] }
warp = { workspace = true, optional = true }
yaml_serde = { workspace = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
async-channel = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "direct_genesis"
path = "tests/direct_genesis.rs"
required-features = ["pq-devnet"]

[[test]]
name = "provision"
path = "tests/provision.rs"
required-features = ["pq-devnet"]

[[test]]
name = "pq_launch_cli"
path = "tests/pq_launch_cli.rs"
required-features = ["pq-beacon-startup-testing"]

[[test]]
name = "pq_attestation"
path = "tests/pq_attestation.rs"
required-features = ["pq-devnet"]

[[test]]
name = "pq_attestation_aggregation"
path = "tests/pq_attestation_aggregation.rs"
required-features = ["pq-devnet"]

[[test]]
name = "pq_consensus_verification"
path = "tests/pq_consensus_verification.rs"
required-features = ["pq-verification-testing"]

[[test]]
name = "pq_transition"
path = "tests/pq_transition.rs"
required-features = ["pq-transition-testing"]

[[test]]
name = "pq_local_transition"
path = "tests/pq_local_transition.rs"
required-features = ["pq-transition-testing"]

[[test]]
name = "pq_randao_transport"
path = "tests/pq_randao_transport.rs"
required-features = ["pq-randao-transport-testing"]

[[test]]
name = "pq_beacon_startup"
path = "tests/pq_beacon_startup.rs"
required-features = ["pq-beacon-startup-testing"]

[[test]]
name = "pq_beacon_import"
path = "tests/pq_beacon_import.rs"
required-features = ["pq-beacon-import-testing"]

[[test]]
name = "pq_attestation_fork_choice"
path = "tests/pq_attestation_fork_choice.rs"
required-features = ["pq-beacon-import-testing"]

[[test]]
name = "pq_attestation_pool"
path = "tests/pq_attestation_pool.rs"
required-features = ["pq-attestation-pool-testing"]

[[test]]
name = "pq_attestation_pool_review"
path = "tests/pq_attestation_pool_review.rs"
required-features = ["pq-attestation-pool-testing"]

[[test]]
name = "pq_local_attester_context"
path = "tests/pq_local_attester_context.rs"
required-features = ["pq-beacon-import-testing"]

[[test]]
name = "pq_block_production"
path = "tests/pq_block_production.rs"
required-features = ["pq-beacon-import-testing"]

[[test]]
name = "pq_publication"
path = "tests/pq_publication.rs"
required-features = ["pq-beacon-import-testing"]

[[test]]
name = "pq_network_service"
path = "tests/pq_network_service.rs"
required-features = ["pq-beacon-import-testing"]

[[test]]
name = "pq_api_privacy"
path = "tests/pq_api_privacy.rs"
